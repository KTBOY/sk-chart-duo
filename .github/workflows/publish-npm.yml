name: Publish to npm

# 通过 npm Trusted Publishing（OIDC）发布 sk-chart-duo —— 无需任何 NPM_TOKEN。
# provenance 不会自动开启，必须显式带 --provenance（见下方 Publish 步骤），否则 npm 走普通鉴权发布、因无 token 而失败。
# 前置条件（一次性）：在 npmjs.com 的 sk-chart-duo 包 Settings → Trusted Publisher 选择 GitHub Actions，填写：
#   Organization or user: KTBOY
#   Repository:          sk-chart-duo   # 必须与 package.json > repository.url 指向的仓库同名
#   Workflow filename:   publish-npm.yml
#   Environment:         留空
#   Allowed actions:     全部不勾（npm stage publish 始终允许，已够本工作流用）
#
# 触发：推送 v* tag（如 v0.1.0），发布成功后自动创建 GitHub Release —— 全自动、零手动点击。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 GitHub Release
      id-token: write # npm OIDC 可信发布
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 必须 24：node 20/22 自带的 npm < 11.5.1，OIDC 走不通。
          node-version: 24
          # 刻意不写 registry-url —— 它会让 setup-node 自动生成 .npmrc，而 npm 优先读该文件、
          # 去找里面的 _authToken，从而跳过 Trusted Publisher 的 OIDC 握手（token 为空也一样失败）。
          # 发布目标源由 package.json > publishConfig.registry 强制指定，无需在这里配。
          cache: npm

      # node 24 自带 npm 11.x，这步只是保险：确保 >= 11.5.1 这条 OIDC 下限。
      - name: Upgrade npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # tag 必须与 package.json 版本一致，避免打错 tag 发出错误版本。
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 版本 ($VERSION) 不一致"
            exit 1
          fi

      # 版本已存在于 npm（例如首次手动发布过、或工作流重跑）则跳过发布，避免 EPUBLISHCONFLICT。
      - name: Check whether version is already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "sk-chart-duo@$VERSION" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "sk-chart-duo@$VERSION 已存在于 npm，跳过发布步骤。"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 无需 NPM_TOKEN：npm 通过 OIDC 使用已配置的 Trusted Publisher 完成鉴权。
      # prepublishOnly 钩子会自动执行 typecheck + test + build，保证发布产物是最新且验证过的。
      #
      # 失败时把 npm 的报错原文抬进 annotation：Actions 的日志正文要登录才能看，
      # 但 annotations 可以匿名经 API 读取，这样远程也能定位（连续 4 次 exit 1 就是这么查的）。
      - name: Publish sk-chart-duo (OIDC Trusted Publishing)
        if: steps.check.outputs.skip != 'true'
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          set +e
          echo "--- 环境：node $(node -v) / npm $(npm -v) / ref ${GITHUB_REF}"
          for f in ./.npmrc "${HOME}/.npmrc"; do
            if [ -f "$f" ]; then echo "--- 发现 $f："; sed 's/\(_authToken=\).*/\1<redacted>/' "$f"; else echo "--- 无 $f"; fi
          done
          env | grep -iE '^(NPM_CONFIG|ACTIONS_ID_TOKEN)' | sed 's/=.*$/=<set>/' || true
          OUT=$(npm publish --access public --provenance 2>&1)
          CODE=$?
          echo "$OUT"
          if [ "$CODE" -ne 0 ]; then
            MSG=$(printf '%s' "$OUT" | grep -iE 'npm error|ENEEDAUTH|E401|E403|E400|provenance|OIDC|attestation|registry' | tail -8 | tr '\n' '|' | sed -e 's/%/%25/g' -e 's/::/%3A%3A/g')
            echo "::error title=npm publish 失败 exit=$CODE::${MSG:-（未匹配到关键行，见日志）}"
          fi
          exit "$CODE"

      # npm 发布成功后才创建 GitHub Release；已存在则跳过（支持工作流重跑）。
      # 刻意不加 --verify-tag：它要求签名 tag，而 `npm version` 默认产出的是未签名 annotated tag，
      # 加上就会出现「npm 已发布成功、建 Release 这步失败」。版本真伪由上面的 tag/版本一致性校验兜。
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes
